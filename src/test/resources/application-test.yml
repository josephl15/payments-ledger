# Loaded only under @ActiveProfiles("test"); overrides application.yml for integration tests.
spring:
  datasource:
    hikari:
      # Pool at least as large as the concurrency-test worker threads (Phases 4 and 5), so requests never queue for a connection while holding locks.
      maximum-pool-size: 20
      # A starved pool fails in 5 s instead of the 30 s default, so a pool bug shows up quickly.
      connection-timeout: 5000
      # The suite keeps several Spring contexts alive at once (one per distinct test configuration) against one
      # PostgreSQL container that allows 100 connections. By default every pool keeps its full 20 connections open
      # even when idle, which used up all 100 once a fifth context existed. Keep 2 idle and let the extra connections
      # that a concurrency test opened close after 10 seconds (10 s is Hikari's minimum idle timeout).
      minimum-idle: 2
      idle-timeout: 10000

ledger:
  jwt:
    # A fake key for tests only (never used anywhere else). 32+ characters as the validation requires.
    secret: test-only-secret-not-for-real-use-0123456789
    # Long on purpose: some tests move the shared MutableClock forward by 25 hours (idempotency expiry) and must not
    # expire the tokens of the users they created earlier. The token-expiry test moves the clock further than this.
    ttl: 2d
